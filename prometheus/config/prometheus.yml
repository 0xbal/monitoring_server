# my global config
global:
  scrape_interval:     15s 
  evaluation_interval: 15s 
  external_labels:
    origin_prometheus: aio

# Alertmanager configuration
alerting:
  alertmanagers:
  - static_configs:
    - targets:
      - alertmanager:9093


rule_files:

scrape_configs:

  - job_name: 'prometheus'
    static_configs:
    - targets: ['prometheus:9090']

  - job_name: 'grafana'
    static_configs:
    - targets: ['grafana:3000']

  - job_name: 'loki'
    static_configs:
    - targets: ['loki:3100']

  - job_name: 'promtail'
    static_configs:
    - targets: ['promtail:9080']

  - job_name: 'local-node-exporter'
    static_configs:
    - targets: ['node-exporter:9100']
  
  - job_name: 'ipmi_exporter'
    static_configs:
    - targets: ['ipmi_exporter:9290'] 
  
  - job_name: 'caadvisor'
    static_configs:
    - targets: ['cadvisor:8080']

